name: raptor

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: raptor-dev
    container_name: raptor-dev
    ports:
      - "1337:5000"
    networks:
        - app_network
    volumes:
      - certs_volume:/certs:ro
      - db_and_backups_volume:/appdata
      - ftp_volume:/ftp/reports
    environment:
      - ENVIRONMENT=development
      - CORS_ORIGINS
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - DATA_PATH=${DATA_PATH:-/appdata/data}
      - LDAP_DOMAIN
      - LDAP_SERVER
      - LDAP_USER
      - LDAP_PASS
      - LDAP_USERS_DN
      - LDAP_VENDOR
      - LDAP_USE_SSL
      - LDAP_START_TLS
      - LDAP_TRUSTSTORE
      - LDAP_USERNAME_ATTR
      - LDAP_UUID_ATTR
      - LDAP_USER_OBJECT_CLASSES
      - KEYCLOAK_IDP_ALIAS
      - KEYCLOAK_IDP_PROVIDER
      - KEYCLOAK_IDP_DISPLAY_NAME
      - KEYCLOAK_IDP_ISSUER
      - KEYCLOAK_IDP_AUTHORIZATION_URL
      - KEYCLOAK_IDP_TOKEN_URL
      - KEYCLOAK_IDP_JWKS_URL
      - KEYCLOAK_IDP_LOGOUT_URL
      - KEYCLOAK_IDP_CLIENT_ID
      - KEYCLOAK_IDP_CLIENT_SECRET
      - KEYCLOAK_IDP_ENTITY_ID
      - KEYCLOAK_IDP_SSO_URL
      - SECRET_KEY
      - ADMIN_USERNAME
      - APP_PORT
      - APP_USE_TLS=${APP_USE_TLS:-false}
      - CERT_FILE
      - KEY_FILE
      - FTP_USER=${FTP_USER:-raptor_ftp_user}
      - FTP_PASS=${FTP_PASS:-raptor_ftp_pass}
      - FTP_HOST=ftp
      - SCANNER_BASE_URL=${SCANNER_BASE_URL:-http://scanner:8082}
      - SCANNER_INTERNAL_TOKEN=${SCANNER_INTERNAL_TOKEN:?SCANNER_INTERNAL_TOKEN must be set}
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://local-llm:8083}
      - RAPTOR_SERVICE_API_KEY=${RAPTOR_SERVICE_API_KEY:?RAPTOR_SERVICE_API_KEY must be set}
      - KALI_SERVER_URL=${KALI_SERVER_URL:-http://kali:5000}
      - KALI_CLIENT_PATH=${KALI_CLIENT_PATH:-/usr/app/src/scanner/mcp-kali-server/client.py}
      - KALI_INTERNAL_TOKEN=${KALI_INTERNAL_TOKEN:-}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      - RAPTOR_PUBLIC_URL=${RAPTOR_PUBLIC_URL:-http://localhost:1337}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-raptor}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      - KEYCLOAK_LOGIN_CLIENT_ID=${KEYCLOAK_LOGIN_CLIENT_ID:-raptor-login}
      - KEYCLOAK_LOGIN_CLIENT_SECRET=${KEYCLOAK_LOGIN_CLIENT_SECRET:?KEYCLOAK_LOGIN_CLIENT_SECRET must be set}
      - KEYCLOAK_BACKEND_CLIENT_ID=${KEYCLOAK_BACKEND_CLIENT_ID:-raptor-backend}
      - KEYCLOAK_BACKEND_CLIENT_SECRET=${KEYCLOAK_BACKEND_CLIENT_SECRET:?KEYCLOAK_BACKEND_CLIENT_SECRET must be set}
    depends_on:
      ftp:
        condition: service_started
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz',timeout=5).status==200 else 1)
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: unless-stopped

  worker:
    image: raptor-dev
    container_name: raptor-worker-dev
    networks:
      - app_network
    volumes:
      - db_and_backups_volume:/appdata
    environment:
      - RAPTOR_ROLE=worker
      - ENVIRONMENT=development
      - CORS_ORIGINS
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - DATA_PATH=${DATA_PATH:-/appdata/data}
      - SECRET_KEY
      - APP_PORT
      - KALI_SERVER_URL=${KALI_SERVER_URL:-http://kali:5000}
      - KALI_INTERNAL_TOKEN=${KALI_INTERNAL_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: raptor-mcp-dev
    container_name: raptor-mcp-dev
    ports:
      - "${MCP_PORT:-8081}:${MCP_PORT:-8081}"
    networks:
      - app_network
    environment:
      - MCP_SERVER_TOKEN=${MCP_SERVER_TOKEN:?MCP_SERVER_TOKEN must be set}
      - RAPTOR_API_BASE_URL=${RAPTOR_API_BASE_URL:-http://app:5000}
      - RAPTOR_SERVICE_API_KEY=${RAPTOR_SERVICE_API_KEY:?RAPTOR_SERVICE_API_KEY must be set}
      - MCP_PORT=${MCP_PORT:-8081}
      - RAPTOR_API_TIMEOUT_SECONDS=${RAPTOR_API_TIMEOUT_SECONDS:-30}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,sys,urllib.request;port=os.getenv("MCP_PORT","8081");url=f"http://127.0.0.1:{port}/healthz";sys.exit(0 if urllib.request.urlopen(url, timeout=5).status==200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  kali:
    build:
      context: .
      dockerfile: Dockerfile.kali
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: raptor-kali-dev
    container_name: raptor-kali-dev
    networks:
      - app_network
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - NO_PROXY=mcp,app,scanner,local-llm,localhost,127.0.0.1
      - no_proxy=mcp,app,scanner,local-llm,localhost,127.0.0.1
      - KALI_INTERNAL_TOKEN=${KALI_INTERNAL_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  scanner:
    build:
      context: .
      dockerfile: Dockerfile.scanner
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: raptor-scanner-dev
    container_name: raptor-scanner-dev
    networks:
      - app_network
    environment:
      - SCANNER_INTERNAL_TOKEN=${SCANNER_INTERNAL_TOKEN:?SCANNER_INTERNAL_TOKEN must be set}
      - MCP_BASE_URL=${MCP_BASE_URL:-http://mcp:8081}
      - MCP_SERVER_TOKEN=${MCP_SERVER_TOKEN:?MCP_SERVER_TOKEN must be set}
      - SCANNER_PORT=8082
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - SCANNER_MAX_CONCURRENT=${SCANNER_MAX_CONCURRENT:-2}
      - KALI_SERVER_URL=${KALI_SERVER_URL:-http://kali:5000}
      - KALI_CLIENT_PATH=${KALI_CLIENT_PATH:-/usr/app/src/scanner/mcp-kali-server/client.py}
      - KALI_INTERNAL_TOKEN=${KALI_INTERNAL_TOKEN:-}
      - NO_PROXY=mcp,app,kali,local-llm,localhost,127.0.0.1
      - no_proxy=mcp,app,kali,local-llm,localhost,127.0.0.1
    depends_on:
      mcp:
        condition: service_healthy
      kali:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8082/healthz',timeout=5).status==200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  local-llm:
    build:
      context: .
      dockerfile: Dockerfile.local_llm
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: raptor-local-llm-dev
    container_name: raptor-local-llm-dev
    networks:
      - app_network
    volumes:
      - llm_models_volume:/models
    environment:
      - SCANNER_INTERNAL_TOKEN=${SCANNER_INTERNAL_TOKEN:?SCANNER_INTERNAL_TOKEN must be set}
      - LOCAL_LLM_PORT=8083
      - LOCAL_LLM_INFER_PORT=8084
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8083/healthz',timeout=5).status==200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ftp:
    image: akogut/docker-pyftpdlib
    container_name: raptor-ftp-dev
    volumes:
      - ftp_volume:/ftp_root/raptor_ftp_user
    environment:
      - FTP_USER=${FTP_USER:-raptor_ftp_user}
      - FTP_PASS=${FTP_PASS:-raptor_ftp_pass}
    command: [
      "python", "ftpd.py",
      "--user", "${FTP_USER:-raptor_ftp_user}",
      "--password", "${FTP_PASS:-raptor_ftp_pass}"
    ]
    networks:
        - app_network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: raptor-keycloak-dev
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=keycloak
      - KC_DB_USERNAME=${POSTGRES_USER:?POSTGRES_USER must be set}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - KC_DB_SCHEMA=keycloak
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_MANAGEMENT_HEALTH_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME=${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
    volumes:
      - ./deploy/keycloak/raptor-realm.json:/opt/keycloak/data/import/raptor-realm.json:ro
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; echo -e \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; timeout 5 cat <&3 | grep -q UP'"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: raptor-postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c 'CREATE SCHEMA IF NOT EXISTS keycloak;'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  db_and_backups_volume:
    name: ${DB_AND_BACKUPS_VOLUME_NAME:-raptor_db_and_backups_volume}
    driver: local
  certs_volume:
    name: ${CERTS_VOLUME_NAME:-raptor_certs_volume}
    driver: local
  ftp_volume:
    name: ${FTP_VOLUME_NAME:-raptor_ftp_volume}
    driver: local
  postgres_data_volume:
    name: ${POSTGRES_DATA_VOLUME_NAME:-raptor_postgres_data_volume}
    driver: local
  llm_models_volume:
    name: ${LLM_MODELS_VOLUME_NAME:-raptor_llm_models_volume}
    driver: local

networks:
  app_network:
