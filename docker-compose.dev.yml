services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - http_proxy=${HTTP_PROXY}
        - https_proxy=${HTTP_PROXY}
    image: wams-dev
    container_name: wams-dev
    ports:
      - "1337:5000"
    networks:
        - app_network
    volumes:
      - dns_zonefiles_volume:/usr/app/src/shared:ro
      - certs_volume:/certs:ro
      - db_and_backups_volume:/appdata
      - ftp_volume:/ftp/reports
    environment:
      - ENVIRONMENT=development
      - CORS_ORIGINS
      - UPDATE_TIME
      - DATA_PATH
      - SHARED_PATH
      - BACKUP_FOLDER
      - LDAP_DOMAIN
      - LDAP_SERVER
      - LDAP_USER
      - LDAP_PASS
      - SECRET_KEY
      - ADMIN_USERNAME
      - APP_PORT
      - CERT_FILE
      - KEY_FILE
      - FTP_USER
      - FTP_PASS
      - FTP_BASEDIR=/ftp_root/${FTP_USER}
      - FTP_HOST=ftp
    restart: unless-stopped

  # ftp:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.ftp
  #     args:
  #       - http_proxy=${HTTP_PROXY}
  #       - https_proxy=${HTTP_PROXY}
  #       - ftp_user=${FTP_USER}
  #       - ftp_pass=${FTP_PASS}
  #       - ftp_basedir=${FTP_BASEDIR}
  #   image: wams-ftp-dev
  #   container_name: wams-ftp-dev
  #   networks:
  #       - app_network
  #   volumes:
  #     - ftp_volume:/ftp/reports
  #   restart: unless-stopped

  ftp:
    image: akogut/docker-pyftpdlib
    container_name: wams-ftp-dev
    volumes:
      - ftp_volume:/ftp_root/dnsradar_ftp_user
    environment:
      - FTP_USER=${FTP_USER}
      - FTP_PASS=${FTP_PASS}
    command: [
      "python", "ftpd.py",
      "--user", "${FTP_USER}",
      "--password", "${FTP_PASSWORD}"
    ]
    networks:
        - app_network
    restart: unless-stopped

  sftp:
    build:
      context: .
      dockerfile: Dockerfile.sftp
      args:
        - DNS_SERVER_SSH_PUBKEY=${DNS_SERVER_SSH_PUBKEY}
        - http_proxy=${HTTP_PROXY}
    image: wams-sftp-dev
    container_name: wams-sftp-dev
    ports:
      - "2222:22"
    volumes:
      - dns_zonefiles_volume:/chroot/upload
    restart: unless-stopped

volumes:
  db_and_backups_volume:
    driver: local
  dns_zonefiles_volume:
    driver: local
  certs_volume:
    driver: local
  ftp_volume:
    driver: local

networks:
  app_network: