stages:
- security_preprocess
- security_check
- build
- deploy

include:
- project: 'security/sast-integrations/templates'
  file: 'sast-check-gate-critical-new-stages.yaml'

before_script:
- export http_proxy=http://proxy.azercell.com:8080
- export https_proxy=http://proxy.azercell.com:8080

variables:
  DOCKER_DRIVER: overlay2
  COMPOSE_FILE_DEV: docker-compose.dev.yml
  COMPOSE_FILE_PROD: docker-compose.prod.yml

########################
# DEV Branch Jobs
########################
build_dev:
  stage: build
  only:
  - dev
  script:
  - echo "Building Docker images for DEV..."
  - docker compose -f $COMPOSE_FILE_DEV build
  - echo "Docker images built locally on callisto."
  tags:
  - callisto

deploy_dev:
  stage: deploy
  only:
  - dev
  when: on_success
  script:
  - echo "Deploying DEV environment on callisto..."
  - test -n "$DATABASE_URL" || (echo "DATABASE_URL must be set" && exit 1)
  - test -n "$POSTGRES_DB" || (echo "POSTGRES_DB must be set" && exit 1)
  - test -n "$POSTGRES_USER" || (echo "POSTGRES_USER must be set" && exit 1)
  - test -n "$POSTGRES_PASSWORD" || (echo "POSTGRES_PASSWORD must be set" && exit 1)
  - test -n "$MCP_SERVER_TOKEN" || (echo "MCP_SERVER_TOKEN must be set" && exit 1)
  - test -n "$RAPTOR_SERVICE_API_KEY" || (echo "RAPTOR_SERVICE_API_KEY must be set" && exit 1)
  - docker compose -f $COMPOSE_FILE_DEV down || true
  - docker compose -f $COMPOSE_FILE_DEV up -d postgres ftp sftp app worker mcp
  - echo "DEV environment is running."
  tags:
  - callisto
  environment:
    name: dev
    url: https://callisto.azercell.com:1337

########################
# PROD Branch Jobs
########################
build_prod:
  stage: build
  only:
  - main
  script:
  - echo "Building Docker images for PROD..."
  - docker compose -f $COMPOSE_FILE_PROD build
  - echo "Docker images built locally on kali01."
  tags:
  - prod-kali

deploy_prod:
  stage: deploy
  only:
  - main
  when: on_success
  script:
  - echo "Deploying PROD environment on kali01..."
  - test -n "$DATABASE_URL" || (echo "DATABASE_URL must be set" && exit 1)
  - test -n "$POSTGRES_DB" || (echo "POSTGRES_DB must be set" && exit 1)
  - test -n "$POSTGRES_USER" || (echo "POSTGRES_USER must be set" && exit 1)
  - test -n "$POSTGRES_PASSWORD" || (echo "POSTGRES_PASSWORD must be set" && exit 1)
  - test -n "$FTP_USER" || (echo "FTP_USER must be set" && exit 1)
  - test -n "$FTP_PASS" || (echo "FTP_PASS must be set" && exit 1)
  - test -n "$MCP_SERVER_TOKEN" || (echo "MCP_SERVER_TOKEN must be set" && exit 1)
  - test -n "$RAPTOR_SERVICE_API_KEY" || (echo "RAPTOR_SERVICE_API_KEY must be set" && exit 1)
  - test -n "$CORS_ORIGINS" || (echo "CORS_ORIGINS must be set" && exit 1)
  - test -n "$SECRET_KEY" || (echo "SECRET_KEY must be set" && exit 1)
  - docker compose -f $COMPOSE_FILE_PROD down || true
  - docker compose -f $COMPOSE_FILE_PROD up -d postgres ftp sftp app worker mcp
  - echo "PROD environment is running."
  tags:
  - prod-kali
  environment:
    name: production
    url: https://kali01.azercell.com:1337
