plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2025.8'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    archiveFileName = 'raptor-burp.jar'
    destinationDirectory = file("$projectDir/dist")
    manifest {
        attributes(
            'Implementation-Title': 'RAPTOR Burp Live',
            'Implementation-Version': '1.1.1',
            'Burp-Extension-Class': 'raptor.burp.RaptorExtension'
        )
    }
}
