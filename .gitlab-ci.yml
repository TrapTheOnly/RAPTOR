# ───────────────────────────────────────────────────────────────
#  Snyk scan for a poly-glot mono-repo
# ───────────────────────────────────────────────────────────────

image:
  name: gitlab01.azercell.com:5555/security/sca-integrations/image:latest
  entrypoint: [""]                     # keep container's /bin/bash

stages:
  - security

# CI/CD ▸ Variables  (masked ✔ / protected if needed)
variables:
  REGISTRY_USERNAME: "$REGISTRY_USERNAME"   # your GitLab username
  REGISTRY_TOKEN:    "$REGISTRY_TOKEN"      # PAT with write_registry
  SNYK_TOKEN:        "$SNYK_TOKEN"          # Snyk org/user token

  # corporate proxy (already baked into the image, duplicated for clarity)
  HTTP_PROXY:  "http://proxy.azercell.com:8080"
  HTTPS_PROXY: "http://proxy.azercell.com:8080"
  NO_PROXY:    "localhost,127.0.0.1"

snyk_scan:
  stage: security

  before_script:
    # #── Registry login (only needed if the image lives in a private project) ──
    # - docker login gitlab01.azercell.com:5555 -u "$REGISTRY_USERNAME" -p "$REGISTRY_TOKEN"

    #── Snyk auth ────────────────────────────────────────────────────────────
    - snyk auth "$SNYK_TOKEN"

  script: |
    set -euo pipefail
    export http_proxy=$HTTP_PROXY https_proxy=$HTTPS_PROXY

    REQ_LIST=$(find . -type f -name 'requirements.txt')
    
    if [[ -n "$REQ_LIST" ]]; then
      echo "➤ Python requirements detected"
    
      # 1) virtual-env
      python3 -m venv .venv
      source .venv/bin/activate
    
      # 2) pip proxy + mirror
      mkdir -p ~/.pip
      printf "[global]\nproxy = %s\nindex-url = https://pypi.org/simple\n" "$HTTP_PROXY" \
        > ~/.pip/pip.conf
    
      # 3) up-to-date tooling
      pip install -q --upgrade pip setuptools wheel
    
      # 4) install every requirements.txt we found
      echo "$REQ_LIST" | while read -r REQ; do
        echo "• pip install -r $REQ"
        pip install -q -r "$REQ" || true
      done
    else
      echo "No requirements.txt found — skipping Python dependency install"
    fi

    # ─────────────── Java / Maven (pom.xml) ──────────────────────────────
    # 0) Ensure JDK & Maven are in PATH (already set in image, but repeat for safety)
    export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    export PATH=$JAVA_HOME/bin:$PATH
    
    # 1) Corporate Maven settings.xml (if provided at repo root)
    if [[ -f settings.xml ]]; then
      echo "• copying settings.xml → ~/.m2/"
      mkdir -p ~/.m2
      cp settings.xml ~/.m2/settings.xml
    fi
    
    # 2) Resolve deps for every pom.xml we can find
    find . -type f -name 'pom.xml' -print0 |
      while IFS= read -r -d '' POM; do
        DIR=$(dirname "$POM")
        echo "• mvn dependency:tree in $DIR"
    
        # make wrapper executable just in case
        [[ -f "$DIR/mvnw" ]] && chmod +x "$DIR/mvnw"
    
        if [[ -x "$DIR/mvnw" ]]; then
          "$DIR/mvnw"  -f "$POM" dependency:tree \
                       -DoutputType=dot --batch-mode --non-recursive || true
        else
          mvn -B       -f "$POM" dependency:tree \
                       -DoutputType=dot --non-recursive || true
        fi
      done

    # ─── Gradle (build.gradle / .kts) ─────────────────────────────────
    find . -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0 \
      | while IFS= read -r -d '' GRFILE; do
      DIR=$(dirname "$GRFILE")
      echo "• gradle dependencies in $DIR"
      chmod +x ./gradlew
      # 1) Proxy just for this Gradle run
      export GRADLE_OPTS="-Dhttp.proxyHost=proxy.azercell.com \
                          -Dhttp.proxyPort=8080 \
                          -Dhttps.proxyHost=proxy.azercell.com \
                          -Dhttps.proxyPort=8080"

      # 2) Prefer the project’s wrapper; fall back to system gradle
      if [[ -x "$DIR/gradlew" ]]; then
        "$DIR/gradlew" -p "$DIR" dependencies --no-daemon || true
      else
        gradle        -p "$DIR" dependencies --no-daemon || true
      fi
      
    done

    # ─────────────── Go (go.mod) ───────────────────────────────────────────
    find . -type f -name 'go.mod' | while read -r GOMOD; do
        DIR=$(dirname "$GOMOD")
        echo "• go mod tidy in $DIR"
        (cd "$DIR" && go mod tidy)
    done

    # ─────────────── Snyk scan (covers every manifest) ─────────────────────
    snyk test \
        --all-projects\
        --detection-depth=8 \
        --color=always
