stages:
- security_preprocess
- security_check
- build
- deploy

include:
- project: 'security/sast-integrations/templates'
  file: 'sast-check-gate-critical-new-stages.yaml'

before_script:
- export http_proxy=http://proxy.azercell.com:8080
- export https_proxy=http://proxy.azercell.com:8080
- |
  if [ -z "$FTP_PASS" ]; then
    export FTP_PASS=$(openssl rand -base64 32)
  fi

variables:
  DOCKER_DRIVER: overlay2
  COMPOSE_FILE_DEV: docker-compose.dev.yml
  COMPOSE_FILE_PROD: docker-compose.prod.yml

########################
# DEV Branch Jobs
########################
build_dev:
  stage: build
  only:
  - dev
  script:
  - echo "Building Docker images for DEV..."
  # Use docker-compose build for a cleaner build process
  - docker compose -f $COMPOSE_FILE_DEV build
  - echo "Docker images built locally on callisto."
  tags:
  - callisto

deploy_dev:
  stage: deploy
  only:
  - dev
  when: on_success
  script:
  - echo "Deploying DEV environment on callisto..."
  - docker compose -f $COMPOSE_FILE_DEV down || true
  - docker compose -f $COMPOSE_FILE_DEV up -d
  - echo "DEV environment is running with HTTPS."
  tags:
  - callisto
  environment:
    name: dev
    url: https://callisto.azercell.com:1337

########################
# PROD Branch Jobs
########################
build_prod:
  stage: build
  only:
  - main
  script:
  - echo "Building Docker images for PROD..."
  - docker compose -f $COMPOSE_FILE_PROD build
  - echo "Docker images built locally on kali01."
  tags:
  - prod-kali

deploy_prod:
  stage: deploy
  only:
  - main
  when: manual
  script:
  - echo "Deploying PROD environment on kali01..."
  - docker compose -f $COMPOSE_FILE_PROD down || true
  - docker compose -f $COMPOSE_FILE_PROD up -d
  - echo "PROD environment is running with HTTPS."
  tags:
  - prod-kali
  environment:
    name: production
    url: https://kali01.azercell.com:1337
