services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dnsradar-prod
    container_name: dnsradar-prod
    ports:
      - "1337:5000"
    volumes:
      - dns_zonefiles_volume:/usr/app/src/shared
      - db_and_backups_volume:/appdata
      - certs_volume:/certs:ro
    environment:
      - ENVIRONMENT=production
      - WAF=${WAF}
      - DNS_HOSTNAME=${DNS_HOSTNAME}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - NGINX=${NGINX}
      - UPDATE_TIME=${UPDATE_TIME}
      - DATA_PATH=${DATA_PATH}
      - SHARED_PATH=${SHARED_PATH}
      - BACKUP_FOLDER=${BACKUP_FOLDER}
      - LDAP_DOMAIN=${LDAP_DOMAIN}
      - LDAP_SERVER=${LDAP_SERVER}
      - LDAP_USER=${LDAP_USER}
      - LDAP_PASS=${LDAP_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - APP_PORT=${APP_PORT}
      - CERT_FILE=${CERT_FILE}
      - KEY_FILE=${KEY_FILE}
    restart: unless-stopped

  sftp:
    build:
      context: .
      dockerfile: Dockerfile.sftp
      args:
        DNS_SERVER_SSH_PUBKEY: ${DNS_SERVER_SSH_PUBKEY}
    image: dnsradar-sftp-prod
    container_name: dnsradar-sftp-prod
    ports:
      - "2222:22"
    volumes:
      - dns_zonefiles_volume:/chroot/upload
    restart: unless-stopped

volumes:
  db_and_backups_volume:
    driver: local
  dns_zonefiles_volume:
    driver: local
  certs_volume:
    driver: local