services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: raptor-dev
    container_name: raptor-dev
    ports:
      - "1337:5000"
    networks:
        - app_network
    volumes:
      - dns_zonefiles_volume:/usr/app/src/shared:ro
      - certs_volume:/certs:ro
      - db_and_backups_volume:/appdata
      - ftp_volume:/ftp/reports
    environment:
      - ENVIRONMENT=development
      - CORS_ORIGINS
      - UPDATE_TIME
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - DATA_PATH
      - SHARED_PATH
      - BACKUP_FOLDER
      - LDAP_DOMAIN
      - LDAP_SERVER
      - LDAP_USER
      - LDAP_PASS
      - SECRET_KEY
      - ADMIN_USERNAME
      - APP_PORT
      - APP_USE_TLS=${APP_USE_TLS:-false}
      - CERT_FILE
      - KEY_FILE
      - FTP_USER=${FTP_USER:-raptor_ftp_user}
      - FTP_PASS=${FTP_PASS:-raptor_ftp_pass}
      - FTP_HOST=ftp
    depends_on:
      ftp:
        condition: service_started
      postgres:
        condition: service_started
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: raptor-mcp-dev
    container_name: raptor-mcp-dev
    ports:
      - "${MCP_PORT:-8081}:${MCP_PORT:-8081}"
    networks:
      - app_network
    environment:
      - MCP_SERVER_TOKEN=${MCP_SERVER_TOKEN:?MCP_SERVER_TOKEN must be set}
      - RAPTOR_API_BASE_URL=${RAPTOR_API_BASE_URL:-http://app:5000}
      - RAPTOR_SERVICE_API_KEY=${RAPTOR_SERVICE_API_KEY:?RAPTOR_SERVICE_API_KEY must be set}
      - MCP_PORT=${MCP_PORT:-8081}
      - RAPTOR_API_TIMEOUT_SECONDS=${RAPTOR_API_TIMEOUT_SECONDS:-30}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,sys,urllib.request;port=os.getenv("MCP_PORT","8081");url=f"http://127.0.0.1:{port}/healthz";sys.exit(0 if urllib.request.urlopen(url, timeout=5).status==200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ftp:
    image: akogut/docker-pyftpdlib
    container_name: raptor-ftp-dev
    volumes:
      - ftp_volume:/ftp_root/raptor_ftp_user
    environment:
      - FTP_USER=${FTP_USER:-raptor_ftp_user}
      - FTP_PASS=${FTP_PASS:-raptor_ftp_pass}
    command: [
      "python", "ftpd.py",
      "--user", "${FTP_USER:-raptor_ftp_user}",
      "--password", "${FTP_PASS:-raptor_ftp_pass}"
    ]
    networks:
        - app_network
    restart: unless-stopped

  sftp:
    build:
      context: .
      dockerfile: Dockerfile.sftp
      args:
        DNS_SERVER_SSH_PUBKEY: ${DNS_SERVER_SSH_PUBKEY:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: raptor-sftp-dev
    container_name: raptor-sftp-dev
    ports:
      - "2222:22"
    volumes:
      - dns_zonefiles_volume:/chroot/upload
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: raptor-postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped

volumes:
  db_and_backups_volume:
    driver: local
  dns_zonefiles_volume:
    driver: local
  certs_volume:
    driver: local
  ftp_volume:
    driver: local
  postgres_data_volume:
    driver: local

networks:
  app_network:
