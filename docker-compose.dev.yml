services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wams-dev
    container_name: wams-dev
    ports:
      - "1337:5000"
    networks:
        - app_network
    volumes:
      - dns_zonefiles_volume:/usr/app/src/shared
      - db_and_backups_volume:/appdata
      - certs_volume:/certs:ro
    environment:
      - ENVIRONMENT=development
      - CORS_ORIGINS=${CORS_ORIGINS}
      - UPDATE_TIME=${UPDATE_TIME}
      - DATA_PATH=${DATA_PATH}
      - SHARED_PATH=${SHARED_PATH}
      - BACKUP_FOLDER=${BACKUP_FOLDER}
      - LDAP_DOMAIN=${LDAP_DOMAIN}
      - LDAP_SERVER=${LDAP_SERVER}
      - LDAP_USER=${LDAP_USER}
      - LDAP_PASS=${LDAP_PASS}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - APP_PORT=${APP_PORT}
      - CERT_FILE=${CERT_FILE}
      - KEY_FILE=${KEY_FILE}
      - FTP_HOST=ftp
      - FTP_USER=${FTP_USER}
      - FTP_PASS=${FTP_PASS}
      - FTP_BASE_PATH=${FTP_BASE_PATH}
    restart: unless-stopped

  # nmap:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.nmap
  #   image: wams-nmap-dev
  #   container_name: wams-nmap-dev
  #   networks:
  #     - app_network
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '0.5'
  #         memory: 256M
  #   restart: unless-stopped

  sftp:
    build:
      context: .
      dockerfile: Dockerfile.sftp
      args:
        DNS_SERVER_SSH_PUBKEY: ${DNS_SERVER_SSH_PUBKEY}
    image: wams-sftp-dev
    container_name: wams-sftp-dev
    ports:
      - "2222:22"
    volumes:
      - dns_zonefiles_volume:/chroot/upload
    restart: unless-stopped

  ftp:
    build:
      context: .
      dockerfile: Dockerfile.ftp
    image: wams-ftp-dev
    container_name: wams-ftp-dev
    ports:
      - "21"
    environment:
      - FTP_USER_NAME=${FTP_USER:-ftpuser}
      - PUBLICHOST=127.0.0.1
    volumes:
      - ftp_data_volume:/home/ftpuser/ftp
    networks:
      - app_network
    restart: unless-stopped


volumes:
  db_and_backups_volume:
    driver: local
  dns_zonefiles_volume:
    driver: local
  certs_volume:
    driver: local
  ftp_data_volume: {}

networks:
  app_network: