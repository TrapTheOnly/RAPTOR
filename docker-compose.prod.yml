name: raptor

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - http_proxy=${HTTP_PROXY}
        - https_proxy=${HTTP_PROXY}
    image: raptor-prod
    container_name: raptor-prod
    ports:
      - "1337:5000"
    networks:
        - app_network
    volumes:
      - dns_zonefiles_volume:/usr/app/src/shared
      - certs_volume:/certs
      - db_and_backups_volume:/appdata
      - ftp_volume:/ftp/reports
    environment:
      - ENVIRONMENT=development
      - CORS_ORIGINS
      - UPDATE_TIME
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - DATA_PATH=${DATA_PATH:-/appdata/data}
      - SHARED_PATH
      - BACKUP_FOLDER
      - LDAP_DOMAIN
      - LDAP_SERVER
      - LDAP_USER
      - LDAP_PASS
      - SECRET_KEY
      - ADMIN_USERNAME
      - APP_PORT
      - APP_USE_TLS=${APP_USE_TLS:-false}
      - CERT_FILE
      - KEY_FILE
      - FTP_USER=${FTP_USER:?FTP_USER must be set}
      - FTP_PASS=${FTP_PASS:?FTP_PASS must be set}
      - FTP_HOST=ftp
      - SCANNER_BASE_URL=${SCANNER_BASE_URL:-http://scanner:8082}
      - SCANNER_INTERNAL_TOKEN=${SCANNER_INTERNAL_TOKEN:?SCANNER_INTERNAL_TOKEN must be set}
      - RAPTOR_SERVICE_API_KEY=${RAPTOR_SERVICE_API_KEY:?RAPTOR_SERVICE_API_KEY must be set}
      - KALI_SERVER_URL=${KALI_SERVER_URL:-http://kali:5000}
      - KALI_CLIENT_PATH=${KALI_CLIENT_PATH:-/usr/app/src/scanner/mcp-kali-server/client.py}
    depends_on:
      ftp:
        condition: service_started
      postgres:
        condition: service_started
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        - http_proxy=${HTTP_PROXY}
        - https_proxy=${HTTP_PROXY}
    image: raptor-mcp-prod
    container_name: raptor-mcp-prod
    ports:
      - "${MCP_PORT:-8081}:${MCP_PORT:-8081}"
    networks:
      - app_network
    environment:
      - MCP_SERVER_TOKEN=${MCP_SERVER_TOKEN:?MCP_SERVER_TOKEN must be set}
      - RAPTOR_API_BASE_URL=${RAPTOR_API_BASE_URL:-http://app:5000}
      - RAPTOR_SERVICE_API_KEY=${RAPTOR_SERVICE_API_KEY:?RAPTOR_SERVICE_API_KEY must be set}
      - MCP_PORT=${MCP_PORT:-8081}
      - RAPTOR_API_TIMEOUT_SECONDS=${RAPTOR_API_TIMEOUT_SECONDS:-30}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,sys,urllib.request;port=os.getenv("MCP_PORT","8081");url=f"http://127.0.0.1:{port}/healthz";sys.exit(0 if urllib.request.urlopen(url, timeout=5).status==200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  kali:
    build:
      context: .
      dockerfile: Dockerfile.kali
      args:
        - http_proxy=${HTTP_PROXY}
        - https_proxy=${HTTP_PROXY}
    image: raptor-kali-prod
    container_name: raptor-kali-prod
    networks:
      - app_network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=
      - no_proxy=
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  scanner:
    build:
      context: .
      dockerfile: Dockerfile.scanner
      args:
        - http_proxy=${HTTP_PROXY}
        - https_proxy=${HTTP_PROXY}
    image: raptor-scanner-prod
    container_name: raptor-scanner-prod
    networks:
      - app_network
    environment:
      - SCANNER_INTERNAL_TOKEN=${SCANNER_INTERNAL_TOKEN:?SCANNER_INTERNAL_TOKEN must be set}
      - MCP_BASE_URL=${MCP_BASE_URL:-http://mcp:8081}
      - MCP_SERVER_TOKEN=${MCP_SERVER_TOKEN:?MCP_SERVER_TOKEN must be set}
      - SCANNER_PORT=8082
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:?AWS_BEARER_TOKEN_BEDROCK must be set}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - SCANNER_MAX_CONCURRENT=${SCANNER_MAX_CONCURRENT:-2}
      - KALI_SERVER_URL=${KALI_SERVER_URL:-http://kali:5000}
      - KALI_CLIENT_PATH=${KALI_CLIENT_PATH:-/usr/app/src/scanner/mcp-kali-server/client.py}
    depends_on:
      mcp:
        condition: service_healthy
      kali:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8082/healthz',timeout=5).status==200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ftp:
    image: akogut/docker-pyftpdlib
    container_name: raptor-ftp-prod
    volumes:
      - ftp_volume:/ftp_root/raptor_ftp_user
    environment:
      - FTP_USER=${FTP_USER:?FTP_USER must be set}
      - FTP_PASS=${FTP_PASS:?FTP_PASS must be set}
    command: [
      "python", "ftpd.py",
      "--user", "${FTP_USER:?FTP_USER must be set}",
      "--password", "${FTP_PASS:?FTP_PASS must be set}"
    ]
    networks:
        - app_network
    restart: unless-stopped

  sftp:
    build:
      context: .
      dockerfile: Dockerfile.sftp
      args:
        - DNS_SERVER_SSH_PUBKEY=${DNS_SERVER_SSH_PUBKEY}
        - http_proxy=${HTTP_PROXY}
    image: raptor-sftp-prod
    container_name: raptor-sftp-prod
    ports:
      - "2222:22"
    volumes:
      - dns_zonefiles_volume:/chroot/upload
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: raptor-postgres-prod
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped

volumes:
  db_and_backups_volume:
    name: ${DB_AND_BACKUPS_VOLUME_NAME:-raptor_db_and_backups_volume}
    driver: local
  dns_zonefiles_volume:
    name: ${DNS_ZONEFILES_VOLUME_NAME:-raptor_dns_zonefiles_volume}
    driver: local
  certs_volume:
    name: ${CERTS_VOLUME_NAME:-raptor_certs_volume}
    driver: local
  ftp_volume:
    name: ${FTP_VOLUME_NAME:-raptor_ftp_volume}
    driver: local
  postgres_data_volume:
    name: ${POSTGRES_DATA_VOLUME_NAME:-raptor_postgres_data_volume}
    driver: local

networks:
  app_network:
