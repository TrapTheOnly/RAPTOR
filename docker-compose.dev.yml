services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wams-dev
    container_name: wams-dev
    ports:
      - "1337:5000"
    volumes:
      - dns_zonefiles_volume:/usr/src/app/shared
    environment:
      - ENVIRONMENT=development
      - WAF=${WAF}
      - NGINX=${NGINX}
      - USE_REMOTE=${USE_REMOTE}
      - DNS_HOSTNAME=${DNS_HOSTNAME} # e.g. DNS_HOSTNAME=/usr/src/app/shared/myzonefile.db
      - UPDATE_TIME=${UPDATE_TIME}
    restart: unless-stopped

  sftp:
    build:
      context: .
      dockerfile: Dockerfile.sftp
      args:
        DNS_SERVER_SSH_PUBKEY: ${DNS_SERVER_SSH_PUBKEY}
    image: wams-sftp-dev
    container_name: wams-sftp-dev
    ports:
      - "2222:22"
    volumes:
      - dns_zonefiles_volume:/chroot/upload
    restart: unless-stopped

volumes:
  dns_zonefiles_volume:
    driver: local