services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - http_proxy=${HTTP_PROXY}
        - https_proxy=${HTTP_PROXY}
    image: dnsradar-prod
    container_name: dnsradar-prod
    ports:
      - "1337:5000"
    networks:
        - app_network
    volumes:
      - dns_zonefiles_volume:/usr/app/src/shared
      - certs_volume:/certs
      - db_and_backups_volume:/appdata
      - ftp_volume:/ftp/reports
    environment:
      - ENVIRONMENT=development
      - CORS_ORIGINS
      - UPDATE_TIME
      - DB_BACKEND
      - DATABASE_URL
      - DATA_PATH
      - SHARED_PATH
      - BACKUP_FOLDER
      - LDAP_DOMAIN
      - LDAP_SERVER
      - LDAP_USER
      - LDAP_PASS
      - SECRET_KEY
      - ADMIN_USERNAME
      - APP_PORT
      - CERT_FILE
      - KEY_FILE
      - FTP_USER
      - FTP_PASS
      - FTP_HOST=ftp 
    depends_on:
      - ftp
    restart: unless-stopped

  ftp:
    image: akogut/docker-pyftpdlib
    container_name: dnsradar-ftp-prod
    volumes:
      - ftp_volume:/ftp_root/dnsradar_ftp_user
    environment:
      - FTP_USER=${FTP_USER}
      - FTP_PASS=${FTP_PASS}
    command: [
      "python", "ftpd.py",
      "--user", "${FTP_USER}",
      "--password", "${FTP_PASS}"
    ]
    networks:
        - app_network
    restart: unless-stopped

  sftp:
    build:
      context: .
      dockerfile: Dockerfile.sftp
      args:
        - DNS_SERVER_SSH_PUBKEY=${DNS_SERVER_SSH_PUBKEY}
        - http_proxy=${HTTP_PROXY}
    image: dnsradar-sftp-prod
    container_name: dnsradar-sftp-prod
    ports:
      - "2222:22"
    volumes:
      - dns_zonefiles_volume:/chroot/upload
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: dnsradar-postgres-prod
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-raptor}
      - POSTGRES_USER=${POSTGRES_USER:-raptor}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-raptor}
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped

  db-migrate:
    image: dnsradar-prod
    profiles: ["postgres"]
    depends_on:
      - postgres
    environment:
      - DATABASE_URL
    volumes:
      - db_and_backups_volume:/appdata
      - ./scripts:/scripts:ro
    command:
      [
        "python",
        "/scripts/migrate_sqlite_to_postgres.py",
        "--sqlite-path",
        "/appdata/data/database.db",
        "--postgres-url",
        "${DATABASE_URL:-postgresql://raptor:raptor@postgres:5432/raptor}",
        "--allow-missing-sqlite",
        "--skip-if-marked"
      ]
    networks:
      - app_network
    restart: "no"

  db-verify:
    image: dnsradar-prod
    profiles: ["postgres"]
    depends_on:
      - postgres
    environment:
      - DATABASE_URL
    volumes:
      - db_and_backups_volume:/appdata
      - ./scripts:/scripts:ro
    command:
      [
        "python",
        "/scripts/verify_postgres_migration.py",
        "--sqlite-path",
        "/appdata/data/database.db",
        "--postgres-url",
        "${DATABASE_URL:-postgresql://raptor:raptor@postgres:5432/raptor}",
        "--allow-missing-sqlite",
        "--require-marker-if-sqlite",
        "--count-mode",
        "ge"
      ]
    networks:
      - app_network
    restart: "no"

volumes:
  db_and_backups_volume:
    driver: local
  dns_zonefiles_volume:
    driver: local
  certs_volume:
    driver: local
  ftp_volume:
    driver: local
  postgres_data_volume:
    driver: local

networks:
  app_network:
