stages:
- security_check

SCA_Check:
  stage: security_check
  image: ubuntu:20.04

  variables:
    SNYK_TOKEN: $SNYK_TOKEN
    HTTP_PROXY: "http://proxy.azercell.com:8080"
    HTTPS_PROXY: "http://proxy.azercell.com:8080"
    http_proxy: "http://proxy.azercell.com:8080"
    https_proxy: "http://proxy.azercell.com:8080"
    NODE_VERSION: "18"

  before_script:
    # Proxy settings
    - export http_proxy=$HTTP_PROXY
    - export https_proxy=$HTTPS_PROXY

    # Timezone setup
    - echo "Etc/UTC" > /etc/timezone
    - ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update && apt-get install -y tzdata curl 
    - dpkg-reconfigure --frontend noninteractive tzdata

    # Install Node.js (NodeSource)
    - curl -fsSL https://deb.nodesource.com/setup_$NODE_VERSION.x | bash -
    - apt-get install -y nodejs git

    # Verify
    - node -v
    - npm -v

    # Configure npm proxy
    - npm config set proxy $HTTP_PROXY
    - npm config set https-proxy $HTTPS_PROXY

    # Install Snyk CLI
    - curl -sL https://static.snyk.io/cli/latest/snyk-linux -o /usr/local/bin/snyk
    - chmod +x /usr/local/bin/snyk
    - snyk config set proxy=$HTTP_PROXY
    - snyk auth "$SNYK_TOKEN"

  script:
    # Install project dependencies
    - if [ -f package-lock.json ]; then npm ci; elif [ -f yarn.lock ]; then npm install -g yarn && yarn install; else echo "No lockfile found"; fi

    # Run Snyk scan
    - snyk test --all-projects --detection-depth=4 --color=always
