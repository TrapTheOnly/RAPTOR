stages:
- security_preprocess
- security_check
- build
- deploy

include:
- project: 'security/sast-integrations/templates'
  file: 'sast-check-gate-critical-new-stages.yaml'

before_script:
- export http_proxy=http://proxy.azercell.com:8080
- export https_proxy=http://proxy.azercell.com:8080

variables:
  DOCKER_DRIVER: overlay2
  COMPOSE_FILE_DEV: docker-compose.dev.yml
  COMPOSE_FILE_PROD: docker-compose.prod.yml

########################
# DEV Branch Jobs
########################
build_dev:
  stage: build
  only:
  - dev
  script:
  - echo "Building Docker images for DEV..."
  - docker compose -f $COMPOSE_FILE_DEV build
  - echo "Docker images built locally on callisto."
  tags:
  - callisto

deploy_dev:
  stage: deploy
  only:
  - dev
  when: on_success
  script:
  - echo "Deploying DEV environment on callisto..."
  - : "${DATABASE_URL:?DATABASE_URL must be set}"
  - : "${POSTGRES_DB:?POSTGRES_DB must be set}"
  - : "${POSTGRES_USER:?POSTGRES_USER must be set}"
  - : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
  - docker compose -f $COMPOSE_FILE_DEV down || true
  - docker compose -f $COMPOSE_FILE_DEV up -d postgres ftp sftp app
  - echo "DEV environment is running."
  tags:
  - callisto
  environment:
    name: dev
    url: https://callisto.azercell.com:1337

########################
# PROD Branch Jobs
########################
build_prod:
  stage: build
  only:
  - main
  script:
  - echo "Building Docker images for PROD..."
  - docker compose -f $COMPOSE_FILE_PROD build
  - echo "Docker images built locally on kali01."
  tags:
  - prod-kali

deploy_prod:
  stage: deploy
  only:
  - main
  when: on_success
  script:
  - echo "Deploying PROD environment on kali01..."
  - : "${DATABASE_URL:?DATABASE_URL must be set}"
  - : "${POSTGRES_DB:?POSTGRES_DB must be set}"
  - : "${POSTGRES_USER:?POSTGRES_USER must be set}"
  - : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
  - : "${FTP_USER:?FTP_USER must be set}"
  - : "${FTP_PASS:?FTP_PASS must be set}"
  - docker compose -f $COMPOSE_FILE_PROD down || true
  - docker compose -f $COMPOSE_FILE_PROD up -d postgres ftp sftp app
  - |
    echo "Running application health check..."
    ok=0
    for i in $(seq 1 30); do
      code_https=$(curl -k -s -o /dev/null -w "%{http_code}" https://localhost:1337/session-status || true)
      if [ "$code_https" = "200" ] || [ "$code_https" = "401" ]; then
        echo "Health check passed over HTTPS with status $code_https"
        ok=1
        break
      fi
      code_http=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:1337/session-status || true)
      if [ "$code_http" = "200" ] || [ "$code_http" = "401" ]; then
        echo "Health check passed over HTTP with status $code_http"
        ok=1
        break
      fi
      sleep 2
    done
    if [ "$ok" -ne 1 ]; then
      echo "Health check failed: /session-status did not return 200/401 in time"
      exit 1
    fi
  - echo "PROD environment is running."
  tags:
  - prod-kali
  environment:
    name: production
    url: https://kali01.azercell.com:1337
